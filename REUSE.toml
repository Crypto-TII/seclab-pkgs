# SPDX-FileCopyrightText: 2025-2026 Technology Innovation Institute (TII)
# SPDX-License-Identifier: Apache-2.0

version = 1

SPDX-PackageName = "seclab-pkgs"
SPDX-PackageSupplier = "Technology Innovation Institute <https://tii.ae>"
SPDX-PackageDownloadLocation = "https://github.com/Crypto-TII/seclab-pkgs"

[[annotations]]
SPDX-License-Identifier = "Apache-2.0"
SPDX-FileCopyrightText = "2025-2026 Technology Innovation Institute (TII)"
precedence = "closest"
path = [
  ".github/workflows/check.yml",
  "flake.lock",
]

# A Code Composer Studio target-config XML; no comment syntax available for an
# inline SPDX header, so it is annotated here. Authored in ~/.dotfiles and moved
# with the package, so it keeps its original licence and copyright.
[[annotations]]
path = "packages/python/f28335-tools/f28335_tools/data/f28335_xds200.ccxml"
precedence = "aggregate"
SPDX-FileCopyrightText = "2025 Brian McGillion"
SPDX-License-Identifier = "MIT"

# The Binary Ninja logo, used as the package's desktop icon. Vendored rather
# than fetched at build time: the upstream URL is unversioned and its content
# has already changed once, breaking the pinned hash. A binary file cannot
# carry an inline SPDX header, so it is annotated here.
[[annotations]]
path = "modules/binaryninja/logo.png"
precedence = "aggregate"
SPDX-FileCopyrightText = "Vector 35 Inc."
SPDX-License-Identifier = "LicenseRef-BinaryNinja-Logo"
